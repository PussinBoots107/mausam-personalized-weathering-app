<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Welcome to Mausam</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell onboarding"><main class="onboarding-content"><div class="logo-mark">☁️</div><span class="eyebrow">MAUSAM · PERSONALIZED</span><h1>Make Mausam work for you.</h1><p>Choose what matters to you and we'll put the most useful weather information first.</p><div class="onboard-grid">
<button data-choice="health">❤️<b>Health</b></button><button data-choice="fitness">🏃<b>Fitness</b></button><button data-choice="travel">✈️<b>Travel</b></button><button data-choice="family">👨‍👩‍👧<b>Family</b></button><button data-choice="agriculture">🌱<b>Agriculture</b></button><button data-choice="commute">🚗<b>Commuter</b></button><button data-choice="beach">🏖️<b>Beach</b></button><button data-choice="events">🎉<b>Events</b></button>
</div><button class="primary-btn" onclick="finish()">Continue →</button></main></div>
<script>let choices=[];document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');const c=b.dataset.choice;choices=choices.includes(c)?choices.filter(x=>x!==c):[...choices,c]});function finish(){if(!choices.length)choices=['health'];localStorage.setItem('mausamInterests',JSON.stringify(choices));location.href='index.html'}</script></body></html>
