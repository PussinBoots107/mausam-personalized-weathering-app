<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Locations | Mausam</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand">Locations</div><button class="small-btn" onclick="addLocation()">+ Add</button></header><main class="page"><div class="search"><input id="locationInput" placeholder="Search city..." onkeydown="if(event.key==='Enter') addLocation()"></div><div id="locationList">
<button class="location-card card" onclick="openPage('index.html')"><span>📍</span><div><b>New Delhi</b><small>India · 29° · Partly Cloudy</small></div><strong>✓</strong></button>
<button class="location-card card" onclick="openPage('destination.html?city=Mumbai')"><span>🌧️</span><div><b>Mumbai</b><small>India · 31° · Rain likely</small></div><strong>→</strong></button>
<button class="location-card card" onclick="openPage('destination.html?city=London')"><span>🌦️</span><div><b>London</b><small>UK · 16° · Rain</small></div><strong>→</strong></button>
</div></main><nav class="bottom-nav"><a href="index.html">⌂<span>Home</span></a><a class="active" href="locations.html">⌖<span>Locations</span></a><a href="alerts.html">♢<span>Alerts</span></a><a href="profile.html">◯<span>Profile</span></a></nav></div>
<script>function addLocation(){const input=document.getElementById('locationInput'),city=input.value.trim();if(!city)return;const el=document.createElement('button');el.className='location-card card';el.innerHTML=`<span>📍</span><div><b>${city}</b><small>Saved destination · Demo data</small></div><strong>→</strong>`;el.onclick=()=>openPage('destination.html?city='+encodeURIComponent(city));document.getElementById('locationList').prepend(el);input.value='';}</script></body></html>
